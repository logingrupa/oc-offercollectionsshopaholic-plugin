1.0.4:
  - 'The element-collection factory on the list component is renamed to makeCollection(). Larajax 3.0 adds a static make() factory to the view-component trait that Cms\Classes\ComponentBase uses, so a component declaring its own non-static make() is a fatal error at class declaration. Twig call sites become Alias.makeCollection(...).'
1.1.0:
  - 'Two components and a seeder turn this plugin into the editorial half of the collections hub. CollectionHub lists every colour family and collection that carries a live shade, CollectionFamilyPage serves one of them with its shades, and both read membership from the colour classifier through Logingrupa.StoreExtender rather than from the offers pivot, which nothing writes to any more. A collection row now holds words only: name, intro, body copy and a picture, keyed to the family slug. offercollections:seed-color-collections creates a row for every family that has none and never touches a row that exists, so an editor can run it again after a new collection appears.'
1.1.1:
  - 'A family page can offer the other families of its own kind: CollectionFamilyPage::getSiblingList answers the collections on a collection page and the colours on a colour page, in hub order, so the theme can draw them as a chip strip and the page stops being a dead end. Four readers no template ever called are gone with it.'
1.1.2:
  - 'The collections page hands the theme the shades each family is drawn with: three for a collection, one for a colour. A picture set on the family''s collection row in the backend takes the first slot, which is how a family whose most confident shade is not a painted nail gets a cover worth showing - the white family leads with a gel swirl otherwise. With no picture set nothing changes, which is the state every family ships in.'
